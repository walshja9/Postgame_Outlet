name: Update board

on:
  push:
    branches: [main]
    paths:
      - ".gitattributes"
      - "pgo_*.py"
      - ".github/workflows/update-board.yml"
      - ".github/workflows/update-season.yml"
      - ".github/workflows/publish-edition.yml"
      - "pgo_publication_guard.py"
      - "pgo_workflow_status.py"
      - "requirements-pgo.txt"
      - "tests/**"
      - "data/**"
      - "generate_site.py"
      - "pgo_comparison.py"
      - "pgo_current_board.py"
      - "pgo_nonqb_availability.py"
      - "pgo_availability_view.py"
      - "pgo_forecast_lab.py"
      - "docs/pgo-theme.css"
      - "pgo_forecast_snapshot.py"
      - "pgo_forecast_weekly.py"
      - "pgo_forecast_corrected.py"
      - "pgo_forecast_postseason.py"
      - "pgo_model_updates.py"
      - "pgo_confidence_picks.py"
      - "pgo_confidence_full_slate.py"
      - "pgo_season*.py"
      - "pgo_penalty_monitor.py"
      - "pgo_totals_monitor.py"
      - "pgo_weights_monitor.py"
      - "research/pgo_penalty_candidate/**"
      - "research/pgo_totals_candidate_20260910/**"
      - "research/pgo_weights_candidate_20260910/**"
      - "research/pgo_replacement_depth_20260910/**"
      - "research/pgo_score_ranges_20260911/**"
      - "research/pgo_injury_usage_20260911/**"
      - "research/pgo_ats_gap_20260911/**"
      - "docs/evidence/penalty-model-2026/**"
      - "docs/evidence/confidence-pool-2026/**"
      - "research/pgo_postseason_candidate/**"
      - "research/pgo_defensive_depth_candidate/**"
      - "docs/evidence/defensive-depth-2026/**"
      - "research/pgo_corrected_roster_candidate/*.py"
      - "docs/evidence/forecast-lab-2026/**"
      - "docs/evidence/nonqb-availability-2026/**"
      - "research/pgo_nonqb_availability_20260909/*.py"
      - "research/pgo_stability_blend/prospective_attestation.json"
      - "!data/snapshots.json"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tested_sha: ${{ steps.tested.outputs.sha }}
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Record the exact tested commit
        id: tested
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PGO test dependency
        run: python -m pip install -r requirements-pgo.txt
      - name: Run tests (includes the editorial gate)
        run: |
          python -m unittest discover -s tests --durations 20
          python -m unittest research.pgo_corrected_roster_candidate.test_candidate research.pgo_corrected_roster_candidate.test_temporal
          python -m unittest research.pgo_defensive_depth_candidate.test_candidate research.pgo_defensive_depth_candidate.test_evidence

  publish:
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: board-update
      cancel-in-progress: false
    env:
      TZ: America/New_York
      TESTED_SHA: ${{ needs.test.outputs.tested_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Admit only tested source with newer mutable season data
        run: |
          git show "$TESTED_SHA:pgo_publication_guard.py" > "$RUNNER_TEMP/pgo_publication_guard.py"
          python "$RUNNER_TEMP/pgo_publication_guard.py" "$TESTED_SHA"
      - name: Install PGO rendering dependency
        run: python -m pip install -r requirements-pgo.txt
      - name: Refresh public board without replacing approved PGO panel
        run: python pgo_comparison.py --refresh-mccabe
      - name: Render verified Forecast Lab archive
        run: python pgo_forecast_lab.py

      # --- walshja9 (canonical / LIVE site): keep the proven commit-back deploy ---
      # Its Pages source is "Deploy from a branch" (main /docs); committing docs/index.html
      # back to main is what refreshes postgameoutlet.com. Unchanged behavior.
      - name: "Commit and push if changed (walshja9 only)"
        if: github.repository == 'walshja9/Postgame_Outlet'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/forecast-lab.html
          if git diff --cached --quiet; then
            echo "Board unchanged - nothing to commit."
          else
            git commit -m "Auto-regenerate board from data change"
            git push origin HEAD:main
            gh api --method POST repos/${{ github.repository }}/pages/builds
          fi

      # --- mccabe206-ops (testing mirror): publish via Pages ARTIFACT, no commit-back ---
      # No commit is written to main, so mccabe/main stays byte-identical to walshja9/main
      # (kills the dual-push drift). Requires: Settings > Pages > Source = "GitHub Actions".
      - name: "Upload Pages artifact (mccabe206-ops only)"
        if: github.repository == 'mccabe206-ops/Postgame_Outlet'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    # mccabe206-ops only: deploy the uploaded artifact to its GitHub Pages testing site.
    needs: publish
    if: github.repository == 'mccabe206-ops/Postgame_Outlet'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
