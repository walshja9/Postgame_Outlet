name: Publish edition

on:
  workflow_dispatch:
    inputs:
      label:
        description: "Edition label (e.g. Week 3)"
        required: true
        type: string

permissions:
  contents: write
  pages: write

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tested_sha: ${{ steps.tested.outputs.sha }}
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Record the exact tested commit
        id: tested
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PGO test dependency
        run: python -m pip install -r requirements-pgo.txt
      - name: Run tests (includes the editorial gate)
        run: python -m unittest discover -s tests

  publish:
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: board-update
      cancel-in-progress: false
    env:
      TZ: America/New_York
      LABEL: ${{ inputs.label }}
      TESTED_SHA: ${{ needs.test.outputs.tested_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Admit only tested source with newer mutable season data
        run: |
          git show "$TESTED_SHA:pgo_publication_guard.py" > "$RUNNER_TEMP/pgo_publication_guard.py"
          python "$RUNNER_TEMP/pgo_publication_guard.py" "$TESTED_SHA"
      - name: Install PGO rendering dependency
        run: python -m pip install -r requirements-pgo.txt
      - name: Snapshot the edition
        run: python snapshot.py "$LABEL"
      - name: Refresh public board without replacing approved PGO panel
        run: python pgo_comparison.py --refresh-mccabe
      - name: Render verified Forecast Lab archive
        run: python pgo_forecast_lab.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots.json docs/index.html docs/forecast-lab.html
          if git diff --cached --quiet; then
            echo "Nothing changed - snapshot may already exist."
            exit 1
          fi
          git commit -m "Publish edition: $LABEL"
          git push origin HEAD:main
      - name: Request canonical Pages build
        if: github.repository == 'walshja9/Postgame_Outlet'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
