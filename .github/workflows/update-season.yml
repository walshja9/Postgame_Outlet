name: Update PGO season

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: board-update
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'walshja9/Postgame_Outlet'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-pgo.txt
      - name: Verify automatic grading, model updates, availability and rendering
        run: python -m unittest tests.test_pgo_season tests.test_pgo_season_boundaries tests.test_pgo_season_sources tests.test_pgo_season_model tests.test_pgo_season_availability tests.test_pgo_season_view tests.test_pgo_season_storage tests.test_pgo_season_accuracy tests.test_pgo_penalty_candidate tests.test_pgo_penalty_monitor tests.test_pgo_penalty_integration tests.test_pgo_totals_monitor tests.test_pgo_weights_monitor tests.test_pgo_replacement_depth tests.test_pgo_season_experiments tests.test_pgo_experiment_view tests.test_pgo_ats tests.test_pgo_ats_view tests.test_pgo_publication_guard tests.test_pgo_workflow_status tests.test_public_board_workflow
      - name: Capture verified finals and advance eligible forecasts
        id: refresh
        run: python pgo_season.py --refresh
      - name: Render current board and auditable archives
        run: |
          python pgo_comparison.py --refresh-mccabe
          python pgo_forecast_lab.py
      - name: Publish changed season data and pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/season-2026 docs/index.html docs/forecast-lab.html
          if ! git diff --cached --quiet; then
            git commit -m "Update verified PGO season records and forecasts"
            git push origin HEAD:main
            gh api --method POST repos/${{ github.repository }}/pages/builds
          fi
      - name: Report saved season and independent experiment health
        if: always() && steps.refresh.outcome == 'success'
        run: python pgo_workflow_status.py
