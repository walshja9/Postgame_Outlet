name: Update PGO season

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
    # Extra checks only do full work during an inactive watch window; GitHub can delay runs.
    - cron: "2,12,17,27,32,42,47,57 * * * *"
  workflow_dispatch:
    inputs:
      alert_delivery_check:
        description: Send a clearly labeled owner notification setup check
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  issues: write

concurrency:
  group: board-update
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'walshja9/Postgame_Outlet'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-pgo.txt
      - name: Route extra inactive checks
        id: route
        env:
          PYTHONPATH: ${{ github.workspace }}
          PGO_EVENT: ${{ github.event_name }}
          PGO_SCHEDULE: ${{ github.event.schedule }}
        shell: python
        run: |
          import os
          from pgo_season import availability_watch, load_current, now, utc

          extra = (os.environ['PGO_EVENT'] == 'schedule'
                   and os.environ['PGO_SCHEDULE'] == '2,12,17,27,32,42,47,57 * * * *')
          run_refresh = True
          if extra:
              checked_at = now()
              watch = availability_watch(load_current(), checked_at)
              run_refresh = any(utc(game['kickoff']) > utc(checked_at) or game['status'] != 'VERIFIED'
                                for game in watch['games'])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'run_refresh={str(run_refresh).lower()}\n')
          print('Full season refresh' if run_refresh else 'No inactive watch window; extra tick skipped')
      - name: Verify automatic grading, model updates, availability and rendering
        id: verify
        if: steps.route.outputs.run_refresh == 'true'
        run: python -m unittest tests.test_pgo_season tests.test_pgo_season_boundaries tests.test_pgo_expected_starters tests.test_pgo_starter_revision tests.test_pgo_starter_capture tests.test_pgo_offensive_inventory tests.test_pgo_offensive_usage_monitor tests.test_pgo_score_range_monitor tests.test_pgo_season_sources tests.test_pgo_season_model tests.test_pgo_season_availability tests.test_pgo_season_view tests.test_pgo_season_storage tests.test_pgo_season_rollover tests.test_pgo_season_accuracy tests.test_pgo_market_benchmark tests.test_pgo_alerts tests.test_pgo_penalty_candidate tests.test_pgo_penalty_monitor tests.test_pgo_penalty_integration tests.test_pgo_totals_monitor tests.test_pgo_weights_monitor tests.test_pgo_replacement_depth tests.test_pgo_replacement_refresh tests.test_pgo_defender_inventory tests.test_pgo_injury_usage_monitor tests.test_pgo_season_experiments tests.test_pgo_experiment_view tests.test_pgo_ats tests.test_pgo_ats_view tests.test_pgo_inactive_monitor tests.test_pgo_publication_guard tests.test_pgo_workflow_status tests.test_public_board_workflow
      - name: Capture verified finals and advance eligible forecasts
        id: refresh
        if: steps.route.outputs.run_refresh == 'true'
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('started_at=' + datetime.now(timezone.utc).isoformat() + '\n')
          PY
          python pgo_season.py --refresh
      - name: Render current board and auditable archives
        id: render
        if: steps.route.outputs.run_refresh == 'true'
        run: |
          python pgo_comparison.py --refresh-mccabe
          python pgo_forecast_lab.py
      - name: Publish changed season data and pages
        id: publish
        if: steps.route.outputs.run_refresh == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/season-2026 docs/index.html docs/forecast-lab.html
          if ! git diff --cached --quiet; then
            git commit -m "Update verified PGO season records and forecasts"
            git push origin HEAD:main
            gh api --method POST repos/${{ github.repository }}/pages/builds
          fi
      - name: Report saved season, inactive context and independent experiment health
        if: always() && steps.refresh.outcome == 'success'
        run: python pgo_workflow_status.py
      - name: Observe the first weekly rollover
        id: rollover
        if: always() && steps.refresh.outcome == 'success'
        run: python pgo_season_rollover.py --output output/rollover-${{ github.run_id }}-${{ github.run_attempt }}.json
      - name: Retain rollover evidence
        if: always() && steps.refresh.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: rollover-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/rollover-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 90
      - name: Check notification delivery when requested
        if: github.event_name == 'workflow_dispatch' && inputs.alert_delivery_check && steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}
          PGO_VERIFY: ${{ steps.verify.outcome }}
          PGO_REFRESH: ${{ steps.refresh.outcome }}
          PGO_RENDER: ${{ steps.render.outcome }}
          PGO_PUBLISH: ${{ steps.publish.outcome }}
          PGO_ROLLOVER: ${{ steps.rollover.outcome }}
          PGO_REFRESH_STARTED: ${{ steps.refresh.outputs.started_at }}
        shell: python
        run: |
          import json
          import os
          import pgo_alerts as alerts
          report = alerts.assess(alerts.load_current(alerts.DEFAULT_ROOT),
              outcomes={stage: os.environ['PGO_' + stage.upper()] for stage in alerts.STAGES},
              refresh_started_at=os.environ['PGO_REFRESH_STARTED'],
              public_pointer=alerts.fetch_public_pointer())
          if report['can_resolve'] and alerts._owned_issue(alerts.github_api)[0] is None:
              report['conditions'] = [dict(key='commissioning', urgent=False,
                  message='Notification delivery setup check only. No model or data failure is being reported.')]
              report['can_resolve'] = False
              url = ('https://github.com/' + alerts.REPOSITORY + '/actions/runs/'
                     + os.environ['GITHUB_RUN_ID'] + '/attempts/' + os.environ['GITHUB_RUN_ATTEMPT'])
              print(json.dumps(alerts.deliver(report, alerts.github_api, url), sort_keys=True))
          else:
              print('Delivery setup check skipped: current health or an existing incident needs review.')
      - name: Notify the PGO owner when attention is needed
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python pgo_alerts.py --deliver --check-public \
            --run-refresh '${{ steps.route.outputs.run_refresh }}' \
            --verify-outcome '${{ steps.verify.outcome }}' \
            --refresh-outcome '${{ steps.refresh.outcome }}' \
            --render-outcome '${{ steps.render.outcome }}' \
            --publish-outcome '${{ steps.publish.outcome }}' \
            --rollover-outcome '${{ steps.rollover.outcome }}' \
            --refresh-started-at '${{ steps.refresh.outputs.started_at }}'
